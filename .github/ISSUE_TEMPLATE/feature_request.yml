name: Feature request
description: Suggest something that would make VISION more useful.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the task and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
